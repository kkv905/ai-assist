[project]
name = "ai-assist"
version = "0.1.0"
description = ""
authors = [
    {name = "Krill K.",email = "test@test.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dotenv (>=0.9.9,<0.10.0)"
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.12,<0.16.0)"
]